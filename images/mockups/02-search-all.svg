<circle cx="130" cy="130" r="130" fill="#3a3a3a"/>
<circle cx="130" cy="130" r="124" fill="none" stroke="#1c1c1c" stroke-width="2"/>
<circle cx="130" cy="130" r="120" fill="#000000"/>
<g transform="translate(10,10)" clip-path="url(#c02)" font-family="Roboto, Helvetica Neue, Arial, sans-serif">
<text x="120" y="44" font-size="13" font-weight="600" fill="#AAAAAA" text-anchor="middle">Add New</text>
<rect x="0" y="65" width="240" height="34" fill="#1565C0"/>
<text x="40" y="88" font-size="17" font-weight="600" fill="#FFFFFF">Search All Sensors</text>
<text x="40" y="126" font-size="17" font-weight="600" fill="#FFFFFF">Heart Rate</text>
<text x="40" y="164" font-size="17" font-weight="600" fill="#FFFFFF">Speed/Cadence</text>
